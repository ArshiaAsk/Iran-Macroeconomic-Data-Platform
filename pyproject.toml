[tool.poetry]
name = "iran-macro-platform"
version = "0.1.0"
description = "A comprehensive data engineering and analytics platform for Iran's macroeconomic indicators"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"  # Constrained by apache-airflow compatibility
sqlalchemy = "^2.0.50"  # 2.0 typed ORM (DeclarativeBase/mapped_column); Airflow 3 also requires >=2.0.50
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"  # Compatible with SQLAlchemy 1.4+
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
playwright = "^1.40.0"
fake-useragent = "^1.4.0"
jdatetime = "^5.0.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
streamlit = "^1.29.0"
plotly = "^6.1.1"
apache-airflow = {version = "^3.3.0", optional = true}  # Airflow 3.x: requires SQLAlchemy >= 2.0.50
asyncpg = "^0.31.0"
openpyxl = "^3.1.0"
xlrd = "^2.0"  # legacy .xls workbooks (xlrd>=2 reads .xls only; openpyxl handles .xlsx)
pdfplumber = "^0.11"  # Persian RTL PDF tables (SCI/CBI publications)
kaleido = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
ruff = "^0.1.9"
mypy = "^1.7.0"
types-requests = "^2.31.0"
ipython = "^8.18.0"
ipykernel = "^6.27.0"
pandas-stubs = "^2.1"

[tool.poetry.extras]
airflow = ["apache-airflow"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PD",  # pandas-vet
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value used in comparison
    "ISC001", # single-line implicit string concat (conflicts with the formatter)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/**/*.py" = ["ARG", "PLR2004", "PT011", "B017", "PT018", "PT004"]  # Allow unused args, magic values, broad exceptions, and fixture naming in tests
"src/connectors/tgju_parser.py" = ["RUF002", "RUF003", "PLR0912"]  # Allow Persian chars in docs, complex branches
"src/utils/persian.py" = ["RUF002", "RUF003"]  # Allow Persian text/digits in docs and comments
"src/connectors/sci_parser.py" = ["RUF001", "RUF002", "RUF003"]  # Allow Persian text and missing-value dashes
"src/connectors/tgju_scraper.py" = ["RUF002", "ARG002", "PLR0912", "N806", "ARG001"]  # Allow Persian chars, unused protocol args, complex branches
"src/connectors/sci_scraper.py" = ["RUF001", "RUF002", "ARG002"]  # Allow Persian text and unused protocol args
"src/etl/gold.py" = ["RUF002"]  # Allow special chars in docstrings
"tests/unit/connectors/test_tgju_parser.py" = ["RUF001", "RUF002", "RUF003"]  # Allow Persian test data
"tests/unit/connectors/test_sci_parser.py" = ["RUF001", "RUF002", "RUF003"]  # Allow Persian test data
"tests/unit/utils/test_persian.py" = ["RUF001", "RUF002", "RUF003"]  # Allow Persian test data
"tests/unit/etl/test_gold.py" = ["F841"]  # Allow unused vars in tests
"airflow/dags/*.py" = ["EM101", "EM102"]  # Allow exception messages in DAGs

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "fake_useragent.*",
    "jdatetime.*",
    "bs4.*",
    "openpyxl.*",
    "xlrd.*",
    "streamlit.*",
    "plotly.*",
    "kaleido.*",
    "airflow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "integration: Integration tests that require database or external services",
    "live: Tests that call live external APIs (run manually only)",
    "slow: Tests that take a long time to run",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/alembic/versions/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abstract",
]
