services:
  postgres:
    # Pinned deliberately (D11): a floating `latest` tag would let local, CI and
    # any future environment diverge, and a TimescaleDB minor upgrade changes
    # extension behaviour and the dump/restore contract. This is the version the
    # platform is validated against (TimescaleDB 2.28.3 / PG 15.18).
    # Resolved digest: sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
    # Keep in sync with .github/workflows/ci.yml (services.postgres.image).
    image: timescale/timescaledb:2.28.3-pg15
    container_name: iran_macro_postgres
    environment:
      POSTGRES_USER: iran_macro
      POSTGRES_PASSWORD: iran_macro_pass
      POSTGRES_DB: iran_macro_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Host port is overridable so the container can coexist with a system
      # PostgreSQL already bound to 5432 (set DATABASE_PORT in .env).
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iran_macro -d iran_macro_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - iran_macro_network

volumes:
  postgres_data:
    driver: local

networks:
  iran_macro_network:
    driver: bridge
