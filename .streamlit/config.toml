# Theme baseline for the local-only dashboard.
#
# Phase 7.2 (D4, ratified) vendors Vazirmatn locally: the font and its OFL
# licence live under `dashboard/static/` and are served by Streamlit's static
# serving at `app/static/...` (no CDN, no webfont fetch). The font families are
# declared here via `[[theme.fontFaces]]` and referenced by name from the theme;
# `dashboard/components/direction.py` applies the RTL direction and the richer
# Persian-capable fallback stack as a safety net. Theme colours/radii are pinned
# to the design tokens by Task 8; see `dashboard/components/tokens.py`.

[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#1f6feb"
font = "Vazirmatn, IRANSans, Tahoma, Segoe UI, sans-serif"
headingFont = "Vazirmatn, IRANSans, Tahoma, Segoe UI, sans-serif"
codeFont = '"DejaVu Sans Mono", "SFMono-Regular", Menlo, Consolas, monospace'
baseFontSize = 16

[[theme.fontFaces]]
family = "Vazirmatn"
url = "app/static/Vazirmatn.ttf"
weight = "100 900"
